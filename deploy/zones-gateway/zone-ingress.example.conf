# Install only on a dedicated Zone hostname after private listener/network cutover.
server {
    listen 443 ssl;
    server_name zone7.example.invalid;
    ssl_certificate /run/zone-access/ingress-cert.pem;
    ssl_certificate_key /run/zone-access/ingress-key.pem;
    client_max_body_size 1m;

    # Existing Tempo API webhook workers must also be paused/migrated.
    location /v1/webhooks { return 403; }
    location /api/v1/webhooks { return 403; }

    location = /rpc {
        proxy_pass http://127.0.0.1:8548;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location /indexer/ {
        proxy_pass http://127.0.0.1:8548;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location = /v1/indexer/query {
        rewrite ^ /indexer/query break;
        proxy_pass http://127.0.0.1:8548;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location / { return 404; }
}
