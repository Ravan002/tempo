[package]
name = "zone-auth"
description = "Zone access credentials, permissions and signed registry reducer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
alloy-primitives = { workspace = true, features = ["std", "serde"] }
alloy-sol-types.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

axum = { workspace = true, features = ["ws"], optional = true }
eyre = { workspace = true, optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"], optional = true }
rustls = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-rustls = { version = "0.26", optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
alloy-signer-local.workspace = true
alloy-signer.workspace = true

[features]
default = []
transport = ["dep:axum", "dep:eyre", "dep:hyper-util", "dep:rustls", "dep:tokio", "dep:tokio-rustls", "dep:tracing"]
