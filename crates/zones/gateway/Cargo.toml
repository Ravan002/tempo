[package]
name = "zone-gateway"
description = "Zone access gateway runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
zone-auth = { workspace = true, features = ["transport"] }
tempo-contracts = { workspace = true, features = ["std"] }
tempo-primitives = { workspace = true, features = ["std"] }
alloy-primitives = { workspace = true, features = ["std", "serde", "rand"] }
alloy-sol-types.workspace = true
axum = { workspace = true, features = ["ws"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
eyre.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
rustls.workspace = true
tracing.workspace = true
metrics.workspace = true
libc = "0.2"
url = { version = "2", features = ["serde"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json"] }
fs2 = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
tower = { workspace = true, features = ["util", "limit"] }

[dev-dependencies]
alloy-signer-local.workspace = true
alloy-signer.workspace = true
tempfile.workspace = true
rcgen = { workspace = true, features = ["pem"] }
