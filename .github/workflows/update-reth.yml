name: Update reth deps

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-reth
  cancel-in-progress: false

jobs:
  update:
    # Configure the reviewed image/environment before enabling the replacement.
    if: >-
      github.repository == 'tempoxyz/tempo' &&
      github.ref == 'refs/heads/main' &&
      vars.UPDATE_RETH_WORKER_IMAGE != ''
    uses: tempoxyz/gh-actions/.github/workflows/dependency-update.yml@1a19b681d0c928e3540cff4303e7b0a35eb66b1a # gh-actions#338
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    with:
      adapter-script: scripts/prepare_reth_update.py
      requested-ref: main
      sts-policy: update-reth
      environment: dependency-updates
      worker-image: ${{ vars.UPDATE_RETH_WORKER_IMAGE }}
      runner: depot-ubuntu-latest-32
      worker-memory: 12g
      local-checks: |
        cargo +nightly-2026-10-02 fmt --all --check
        cargo +nightly-2026-10-02 clippy --all-targets --all-features --locked -- -D warnings
        cargo nextest run --profile ci --locked --no-run
        zepter run check
      allowed-paths: |
        Cargo.toml
        Cargo.lock
        bin/**/Cargo.toml
        bin/**/*.rs
        crates/**/Cargo.toml
        crates/**/*.rs
        examples/**/Cargo.toml
        examples/**/*.rs
        xtask/Cargo.toml
        xtask/**/*.rs
      required-workflows: |
        .github/workflows/lint.yml
        .github/workflows/test.yml
        .github/workflows/specs.yml
        .github/workflows/dependency-scan.yml
        .github/workflows/publish-check.yml
        .github/workflows/semver-check.yml
      repair-instructions: |
        Migrate Tempo to the selected reth APIs. Run zepter to fix feature wiring if needed.
        Non-reth dependency versions may change when necessary.
        Preserve protocol invariants and tests; do not suppress warnings or modify reth Git sources.
      max-local-repairs: 10
      max-ci-repairs: 10
      repair-budget-minutes: 120
    secrets:
      AMP_API_KEY: ${{ secrets.AMP_API_KEY }}

  follow-ups:
    needs: update
    if: needs.update.outputs.status == 'passed'
    runs-on: ubuntu-latest
    environment: dependency-updates
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
      - name: Fetch follow-up token via STS
        id: sts
        uses: tempoxyz/gh-actions/actions/github-sts@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          policy: update-reth-followups
          ttl: 15m
      - name: Label the validated PR for dependency review and Cyclops audit
        env:
          GH_TOKEN: ${{ steps.sts.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.update.outputs.pull-request-number }}
          EXPECTED_SHA: ${{ needs.update.outputs.head-sha }}
        run: |
          set -euo pipefail
          pull="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")"
          jq -e --arg repo "$GH_REPO" --arg sha "$EXPECTED_SHA" '
            .state == "open" and .head.repo.full_name == $repo and
            .head.ref == "reth-auto-bump" and .head.sha == $sha
          ' <<< "$pull" >/dev/null
          gh pr edit "$PR_NUMBER" --repo "$GH_REPO" --add-label A-dependencies --add-label cyclops

  benchmark:
    needs: [update, follow-ups]
    if: needs.update.outputs.status == 'passed'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/bench-e2e.yml
    with:
      pr: ${{ needs.update.outputs.pull-request-number }}
      actor: tempo-github-sts[bot]
      preset: tip20
      duration: "300"
      max-concurrent-requests: "500"
      run-pairs: "2"
      run-type: comment
      no-slack: ${{ 'false' }}
      feature: ${{ needs.update.outputs.head-sha }}
      pr-head-sha: ${{ needs.update.outputs.head-sha }}
      pr-head-ref: reth-auto-bump
    secrets:
      TEMPO_TELEMETRY_URL: ${{ secrets.TEMPO_TELEMETRY_URL }}
      GRAFANA_TEMPO: ${{ secrets.GRAFANA_TEMPO }}
      CLICKHOUSE_URL: ${{ secrets.CLICKHOUSE_URL }}
      CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
      CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
      BENCH_VICTORIAMETRICS_URL: ${{ secrets.BENCH_VICTORIAMETRICS_URL }}
      VICTORIAMETRICS_URL: ${{ secrets.VICTORIAMETRICS_URL }}
      VICTORIALOGS_URL: ${{ secrets.VICTORIALOGS_URL }}
      SLACK_BENCH_BOT_TOKEN: ${{ secrets.SLACK_BENCH_BOT_TOKEN }}
      SLACK_BENCH_CHANNEL: ${{ secrets.SLACK_BENCH_CHANNEL }}

  notify-failure:
    needs: [update, follow-ups]
    if: >-
      always() && github.repository == 'tempoxyz/tempo' &&
      (needs.update.result == 'failure' || needs.follow-ups.result == 'failure')
    runs-on: ubuntu-latest
    environment: dependency-updates
    permissions:
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
      - name: Alert reth on-call
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BENCH_BOT_TOKEN }}
          PR_URL: ${{ needs.update.outputs.pull-request-url }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_BOT_TOKEN:-}" ]; then
            echo "::warning::Slack token is unavailable; skipping notification"
            exit 0
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload="$(jq -n --arg pr "$PR_URL" --arg run "$run_url" '{
            channel: "C09KA1JNJ02",
            text: ("<!subteam^S0C0784UDQF|oncall-reth> Reth update failed. " +
                   (if $pr == "" then "" else "PR: " + $pr + " " end) + "Workflow: " + $run),
            unfurl_links: false,
            unfurl_media: false
          }')"
          curl -fsS --retry 2 -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-Type: application/json' --data "$payload" https://slack.com/api/chat.postMessage |
            jq -e '.ok == true' >/dev/null
