name: Zones Release
# Adapted from Reth's release workflow
# https://github.com/paradigmxyz/reth/blob/main/.github/workflows/release.yml

on:
  push:
    tags:
      - "zones/v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., zones/v0.3.5)"
        required: true
        type: string
      profile:
        description: "Build profile"
        default: "profiling"
        type: choice
        options:
          - "release"
          - "profiling"
          - "maxperf"
      dry_run:
        description: "Dry run (build binaries without creating release)"
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

concurrency:
  group: zones-release-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  get-version:
    permissions:
      contents: read
      id-token: write
    name: Get Version
    if: github.repository == 'tempoxyz/tempo'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
      commit_sha: ${{ steps.get_version.outputs.commit_sha }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Get version from tag
        id: get_version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          if ! [[ "$tag" =~ ^zones/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Expected a Zones release tag: zones/vX.Y.Z[-prerelease]" >&2
            exit 1
          fi
          commit_sha="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
          if [[ "$tag_commit" != "$commit_sha" || ! "$commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release tag $tag does not resolve to checked-out commit $commit_sha" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#zones/}"
            echo "commit_sha=$commit_sha"
          } >> "$GITHUB_OUTPUT"

  check-version:
    permissions:
      contents: read
      id-token: write
    name: check version
    runs-on: ubuntu-latest
    needs: get-version
    if: github.repository == 'tempoxyz/tempo'
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.get-version.outputs.commit_sha }}
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          toolchain: stable
      - name: Verify crate version matches tag
        # Check that the Cargo version starts with the tag,
        # so that Cargo version 1.4.8 can be matched against both v1.4.8 and v1.4.8-rc.1
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          tag="$VERSION"
          tag=${tag#v}
          cargo_ver=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tempo-zone") | .version')
          [[ "$tag" == "$cargo_ver" || "$tag" == "$cargo_ver-"* ]] || { echo "Tag $tag doesn’t match the Cargo version $cargo_ver"; exit 1; }

  build-release:
    permissions:
      contents: read
      id-token: write
    name: Build Release Binaries
    needs: [get-version, check-version]
    if: github.repository == 'tempoxyz/tempo'
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        binary:
          - name: tempo-zone
            features: "asm-keccak,jemalloc"
        platform:
          - os: depot-ubuntu-latest-16
            target: x86_64-unknown-linux-gnu
          - os: depot-ubuntu-latest-arm-16
            target: aarch64-unknown-linux-gnu
          - os: depot-macos-15
            target: aarch64-apple-darwin

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.get-version.outputs.commit_sha }}

      - name: Install Rust toolchain
        uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          toolchain: stable
          targets: ${{ matrix.platform.target }}

      - name: Setup mold linker
        if: runner.os == 'Linux'
        uses: tempoxyz/gh-actions/actions/setup-mold@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - name: Get build profile
        id: profile
        env:
          INPUT_PROFILE: ${{ inputs.profile }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "profile=${INPUT_PROFILE}" >> "$GITHUB_OUTPUT"
          else
            echo "profile=maxperf" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Build binary
        env:
          CARGO_TARGET_DIR: target
          BINARY_NAME: ${{ matrix.binary.name }}
          FEATURES: ${{ matrix.binary.features }}
          PROFILE: ${{ steps.profile.outputs.profile }}
          TARGET: ${{ matrix.platform.target }}
        run: cargo build --locked --bin "$BINARY_NAME" --features "$FEATURES" --profile "$PROFILE" --target "$TARGET"

      - name: Prepare binary
        id: prepare
        shell: bash
        env:
          BINARY: ${{ matrix.binary.name }}
          TARGET: ${{ matrix.platform.target }}
          PROFILE: ${{ steps.profile.outputs.profile }}
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          if [ "$PROFILE" = "dev" ]; then
            PROFILE_DIR="debug"
          else
            PROFILE_DIR="$PROFILE"
          fi

          BINARY_PATH="target/${TARGET}/${PROFILE_DIR}/${BINARY}"
          BINARY_NAME="${BINARY}-${VERSION}-${TARGET}"
          ARCHIVE_NAME="${BINARY}-${VERSION}-${TARGET}.tar.gz"

          cp "$BINARY_PATH" "$BINARY_NAME"
          tar czf "$ARCHIVE_NAME" "$BINARY_NAME"

          {
            echo "archive_name=$ARCHIVE_NAME"
            echo "archive_path=$ARCHIVE_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        shell: bash
        env:
          ARCHIVE_PATH: ${{ steps.prepare.outputs.archive_path }}
          ARCHIVE_NAME: ${{ steps.prepare.outputs.archive_name }}
        run: |
          shasum -a 256 "$ARCHIVE_PATH" > "${ARCHIVE_NAME}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.binary.name }}-${{ matrix.platform.target }}
          path: |
            ${{ steps.prepare.outputs.archive_path }}
            ${{ steps.prepare.outputs.archive_name }}.sha256
          if-no-files-found: error

  create-release:
    name: Create Release
    needs: [get-version, build-release]
    if: ${{ github.repository == 'tempoxyz/tempo' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) }}
    runs-on: depot-ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      # This is necessary for generating the changelog.
      # It has to come before "Download Artifacts" or else it deletes the artifacts.
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.get-version.outputs.commit_sha }}

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # Exclude diagnostic artifacts uploaded by Secure Runner.
          pattern: tempo-zone-*
          path: artifacts

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.get-version.outputs.version }}
          TAG: ${{ needs.get-version.outputs.tag }}
          COMMIT_SHA: ${{ needs.get-version.outputs.commit_sha }}
        run: |
          set -euo pipefail
          # Determine if this is a prerelease
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi

          # Peel annotated tags as well as lightweight tags before publishing.
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object')"
          while [[ "$(jq -r '.type' <<< "$tag_object")" == tag ]]; do
            tag_sha="$(jq -r '.sha' <<< "$tag_object")"
            tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object')"
          done
          if [[ "$(jq -r '.type' <<< "$tag_object")" != commit || \
                "$(jq -r '.sha' <<< "$tag_object")" != "$COMMIT_SHA" ]]; then
            echo "Release tag $TAG no longer resolves to verified commit $COMMIT_SHA" >&2
            exit 1
          fi

          # Create draft release with all artifacts
          gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --verify-tag \
            --title "Zones $VERSION" \
            --draft \
            --latest=false \
            --notes "" \
            $PRERELEASE \
            artifacts/**/*
